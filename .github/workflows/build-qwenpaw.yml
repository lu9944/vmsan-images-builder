name: Build qwenpaw rootfs

on:
  push:
    branches: [main]
    paths:
      - 'images/qwenpaw/**'
      - 'build.sh'
      - '.github/workflows/build-qwenpaw.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'QwenPaw git ref (branch/tag/commit). Leave empty to use latest release.'
        required: false
        default: ''
      image_size:
        description: 'Minimum image size in MB'
        required: false
        default: '2048'
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest QwenPaw release tag
        id: resolve_ref
        if: github.event.inputs.source_ref == ''
        run: |
          LATEST_TAG=$(curl -sf "https://api.github.com/repos/agentscope-ai/QwenPaw/releases/latest" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "ref=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved latest release: $LATEST_TAG"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y e2fsprogs && break
            echo "Retry $i: apt-get failed, retrying in 10s..."
            sleep 10
          done

      - name: Build rootfs image
        run: |
          chmod +x build.sh
          ./build.sh \
            --image qwenpaw \
            --size "${{ github.event.inputs.image_size || '2048' }}" \
            --no-docker-cache
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref || steps.resolve_ref.outputs.ref }}

      - name: Install vmsan
        run: curl -fsSL https://vmsan.dev/install | sudo bash

      - name: Test VM boot with vmsan
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail

          IMAGE="$(pwd)/qwenpaw-rootfs.ext4"
          echo "=== Booting VM from $IMAGE ($(du -sh "$IMAGE" | cut -f1)) ==="

          # vmsan create may output non-JSON progress to stderr; --json goes to stdout
          VM_OUT=$(sudo env "PATH=$PATH" vmsan create \
            --rootfs "$IMAGE" \
            --memory 4096 \
            --vcpus 2 \
            --json || true)

          echo "=== vmsan create output ==="
          echo "$VM_OUT"
          echo "=== end output ==="

          # vmsan 0.3.x emits "vmId" (not "id") in the create JSON.
          VM_ID=$(echo "$VM_OUT" | grep -o '"vmId"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          echo "VM ID: $VM_ID"

          if [ -z "$VM_ID" ]; then
            echo "ERROR: No VM ID returned from vmsan create"
            exit 1
          fi

          # Probe boot readiness via `vmsan exec` rather than `vmsan list`
          # (its JSON field shape is unstable across vmsan versions — see
          # reference/ci-cd-workflows.md). exec only succeeds once the guest
          # agent is up, which is what we actually care about.
          echo "=== Waiting for VM to boot ==="
          BOOTED=""
          for i in $(seq 1 24); do
            sleep 5
            if vmsan exec "$VM_ID" echo "VM is alive" >/dev/null 2>&1; then
              BOOTED=1
              echo "  attempt $i: VM responding to exec"
              break
            fi
            echo "  attempt $i: not ready yet"
          done

          if [ -z "$BOOTED" ]; then
            echo "ERROR: VM never responded to exec within timeout"
            sudo env "PATH=$PATH" vmsan remove --force "$VM_ID" 2>/dev/null || true
            exit 1
          fi

          echo "=== VM is alive ==="

          echo "=== Waiting for qwenpaw service on :8088 ==="
          # systemd starts qwenpaw.service after network.target; uvicorn import
          # + bundled-skills sync can take a while on 2.x, so poll for the
          # LISTEN socket (more reliable than curl-through-vmsan-exec).
          DASH_OK=""
          SVC="unknown"
          for i in $(seq 1 40); do
            SVC=$(vmsan exec "$VM_ID" systemctl is-active qwenpaw 2>/dev/null || echo "unknown")
            if vmsan exec "$VM_ID" ss -tln 2>/dev/null | grep -q ":8088"; then
              DASH_OK=1
              echo "  attempt $i: service=$SVC  8088 LISTEN"
              break
            fi
            echo "  attempt $i: service=$SVC  8088 not listening yet"
            sleep 5
          done

          if [ -z "$DASH_OK" ]; then
            echo "WARN: 8088 not listening within timeout (service=$SVC)"
            echo "--- listening sockets (single-arg form) ---"
            vmsan exec "$VM_ID" "sudo ss -tlnp" || true
            echo "--- listening sockets (multi-arg form) ---"
            vmsan exec "$VM_ID" sudo ss -tlnp || true
            echo "--- PID 1 and processes ---"
            vmsan exec "$VM_ID" "ps -ef | head -40" || true
            echo "--- qwenpaw.service status (root) ---"
            vmsan exec "$VM_ID" sudo systemctl status qwenpaw --no-pager -l || true
            echo "--- journalctl (last 80 lines) ---"
            vmsan exec "$VM_ID" "sudo journalctl -u qwenpaw --no-pager -n 80" || true
            echo "--- OOM check ---"
            vmsan exec "$VM_ID" "sudo dmesg | grep -iE 'oom|killed process' | tail -10" || true
          else
            CODE=$(vmsan exec "$VM_ID" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/ 2>/dev/null || echo "000")
            echo "=== QwenPaw console is up on :8088 (HTTP $CODE) ==="
          fi

          echo "=== Cleanup ==="
          sudo env "PATH=$PATH" vmsan stop "$VM_ID"
          sudo env "PATH=$PATH" vmsan remove "$VM_ID"

          echo "=== VM test passed ==="

      - name: Generate filename
        id: meta
        run: |
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          REF="${{ github.event.inputs.source_ref || steps.resolve_ref.outputs.ref }}"
          BASENAME="qwenpaw-rootfs-${REF}-${TIMESTAMP}"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"
          echo "ext4=${BASENAME}.ext4" >> "$GITHUB_OUTPUT"
          echo "gz=${BASENAME}.ext4.gz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.basename }}
          name: "QwenPaw rootfs ${{ steps.meta.outputs.basename }}"
          body: |
            Built from QwenPaw `${{ github.event.inputs.source_ref || steps.resolve_ref.outputs.ref }}`
            - **Compressed**: `${{ steps.meta.outputs.gz }}` (gzip)
          files: ./qwenpaw-rootfs.ext4.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
